[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-basic"
version = "0.4.0"
description = "An independent, offline BASIC interpreter and interactive environment"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Ghost BASIC contributors"}]
dependencies = ["textual>=6.12,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
screenshots = ["CairoSVG>=2.7,<3"]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "pytest-asyncio>=0.25"]

[project.scripts]
ghost-basic = "ghost_basic.cli:main"
GBASIC = "ghost_basic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ghost_basic"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
ghost_basic = ["data/*.json"]
